name: Docker

on:
  push:
    branches:
      - pipeline-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t mariadeoliveira/entregable-cicd-devops:latest .

      - name: Push Docker Image
        run: docker push mariadeoliveira/entregable-cicd-devops:latest