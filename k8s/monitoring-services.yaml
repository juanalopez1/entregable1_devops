apiVersion: v1
kind: Service
metadata:
  name: todo-blue-metrics
spec:
  selector:
    app: todo-app
    version: blue
  ports:
    - name: metrics
      port: 5000
      targetPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: todo-green-metrics
spec:
  selector:
    app: todo-app
    version: green
  ports:
    - name: metrics
      port: 5000
      targetPort: 5000
