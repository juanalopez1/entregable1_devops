apiVersion: v1
kind: ConfigMap

metadata:
  name: alertmanager-config

data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h

    receivers:
      - name: default
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: alertmanager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0

          args:
            - --config.file=/etc/alertmanager/alertmanager.yml

          ports:
            - containerPort: 9093

          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager

      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service

metadata:
  name: alertmanager-service

spec:
  selector:
    app: alertmanager

  ports:
    - protocol: TCP
      port: 9093
      targetPort: 9093

  type: NodePort
