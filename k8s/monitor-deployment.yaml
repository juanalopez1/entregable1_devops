apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-monitor

spec:
  replicas: 1

  selector:
    matchLabels:
      app: todo-monitor

  template:
    metadata:
      labels:
        app: todo-monitor

    spec:
      containers:
        - name: todo-monitor
          image: todo-monitor:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
