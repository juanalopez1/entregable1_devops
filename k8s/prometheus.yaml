apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: todo-blue
        static_configs:
          - targets: ["todo-blue-metrics:5000"]

      - job_name: todo-green
        static_configs:
          - targets: ["todo-green-metrics:5000"]

  alerts.yml: |
    groups:
      - name: taskflow-alerts
        rules:
          - alert: TooManyTaskOperations
            expr: sum(increase(todo_operations_total[5m])) > 10
            labels:
              severity: warning
            annotations:
              summary: "TaskFlow superó 10 operaciones en 5 minutos"
              description: "Se detectaron más de 10 operaciones en los últimos 5 minutos."

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          ports:
            - containerPort: 9090
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
