apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-readonly-root-filesystem
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-readonly-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      # Falco necesita inspeccionar el host; las cargas de aplicación siguen sujetas a la política.
      # Herramientas de infraestructura (charts oficiales) que necesitan permisos
      # especiales; las cargas de la aplicación siguen sujetas a la política.
      exclude:
        any:
          - resources:
              namespaces:
                - falco
                - monitoring
                - ingress-nginx
                - kyverno
                - kube-system
      validate:
        message: "Todos los contenedores deben tener readOnlyRootFilesystem: true."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
            =(initContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
