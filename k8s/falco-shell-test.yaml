apiVersion: v1
kind: Pod
metadata:
  name: falco-shell-test
  namespace: default
  labels:
    app: falco-shell-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 32Mi
