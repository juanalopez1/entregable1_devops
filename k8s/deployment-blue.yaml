apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-blue

spec:
  replicas: 1

  selector:
    matchLabels:
      app: todo-app
      version: blue

  template:
    metadata:
      labels:
        app: todo-app
        version: blue # IMPORTANTE !!! aca definimos

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: todo-app
          image: mariadeoliveira/todo-app:blue
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

          ports:
            - containerPort: 5000
