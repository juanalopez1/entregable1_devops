<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow - BLUE v1</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }

      .page {
        width: 100%;
        max-width: 760px;
        margin: 60px auto;
        padding: 0 20px;
      }

      .app {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      }

      .header {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        padding: 35px;
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }

      .header h1 {
        margin: 0;
        font-size: 30px;
      }

      .header p {
        margin: 8px 0 0;
        opacity: 0.85;
      }

      .version {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: bold;
        font-size: 13px;
        white-space: nowrap;
      }

      .content {
        padding: 30px;
      }

      .add-form {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }

      .add-form input {
        flex: 1;
        min-width: 0;
        border: 1px solid #dbe2ea;
        background: #f9fafb;
        padding: 13px 15px;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
      }

      .add-form input:focus {
        border-color: #2563eb;
        background: white;
      }

      button {
        border: none;
        border-radius: 9px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .add-button {
        background: #2563eb;
        color: white;
        padding: 0 20px;
      }

      .section-title {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #9ca3af;
        font-weight: bold;
        margin-bottom: 12px;
      }

      .tasks {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 15px 16px;
        background: white;
      }

      .task-name {
        font-size: 15px;
        font-weight: 500;
        word-break: break-word;
      }

      .completed {
        text-decoration: line-through;
        color: #9ca3af;
      }

      .task-actions {
        display: flex;
        gap: 7px;
        flex-shrink: 0;
      }

      .complete {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .delete {
        background: #fee2e2;
        color: #b91c1c;
      }

      .empty {
        text-align: center;
        padding: 45px 20px;
        color: #9ca3af;
        border: 2px dashed #e5e7eb;
        border-radius: 14px;
      }

      .empty-icon {
        font-size: 35px;
        margin-bottom: 10px;
      }

      .footer {
        margin-top: 25px;
        text-align: center;
        font-size: 12px;
        color: #9ca3af;
      }

      @media (max-width: 600px) {
        .page {
          margin: 25px auto;
        }

        .header {
          padding: 25px;
        }

        .header-top {
          align-items: flex-start;
          flex-direction: column;
        }

        .content {
          padding: 20px;
        }

        .add-form {
          flex-direction: column;
        }

        .add-button {
          padding: 13px;
        }

        .task {
          align-items: flex-start;
          flex-direction: column;
        }

        .task-actions {
          width: 100%;
        }

        .task-actions form {
          flex: 1;
        }

        .task-actions button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="app">
        <header class="header">
          <div class="header-top">
            <div>
              <h1>TaskFlow</h1>
              <p>Organizá tus tareas de forma simple.</p>
            </div>

            <div class="version">{{ version }}</div>
          </div>
        </header>

        <main class="content">
          <form class="add-form" method="POST" action="/add">
            <input
              type="text"
              name="title"
              placeholder="¿Qué tenés que hacer?"
              required
              autocomplete="off"
            />

            <button class="add-button" type="submit">+ Agregar</button>
          </form>

          <div class="section-title">Mis tareas</div>

          {% if tasks %}

          <div class="tasks">
            {% for task in tasks %}

            <div class="task">
              <span
                class="task-name {% if task.completed %}completed{% endif %}"
              >
                {{ task.title }}
              </span>

              <div class="task-actions">
                <form method="POST" action="/complete/{{ task.id }}">
                  <button class="complete" type="submit">
                    {% if task.completed %} Deshacer {% else %} ✓ Completar {%
                    endif %}
                  </button>
                </form>

                <form method="POST" action="/delete/{{ task.id }}">
                  <button class="delete" type="submit">Eliminar</button>
                </form>
              </div>
            </div>

            {% endfor %}
          </div>

          {% else %}

          <div class="empty">
            <div class="empty-icon">✓</div>

            <div>No tenés tareas pendientes.</div>
          </div>

          {% endif %}

          <div class="footer">TaskFlow · Blue Deployment</div>
        </main>
      </div>
    </div>
  </body>
</html>
