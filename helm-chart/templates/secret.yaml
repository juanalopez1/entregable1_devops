{{- /*
Clave secreta de Flask. Se reutiliza la que ya existe en el cluster (lookup)
para que no cambie en cada helm upgrade; si no existe, se usa la de values
o se genera una al azar.
*/}}
{{- $name := include "todo-app.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.secretKey }}
{{- if and (not $key) $existing }}
{{- $key = index $existing.data "SECRET_KEY" | b64dec }}
{{- end }}
{{- if not $key }}
{{- $key = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ $key | b64enc | quote }}
